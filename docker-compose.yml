services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vulnalert}
      POSTGRES_USER: ${POSTGRES_USER:-vulnalert}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vulnalert}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vulnalert}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/vulnalert}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-vulnalert}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-vulnalert}
      NVD_API_KEY: ${NVD_API_KEY:-}
      APP_SECURITY_MODE: ${APP_SECURITY_MODE:-demo}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_SQS_QUEUE_URL: ${AWS_SQS_QUEUE_URL:-}
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports: ["5173:80"]
    depends_on: [api]
volumes:
  postgres_data:

